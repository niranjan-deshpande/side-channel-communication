<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1A1A1A">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
    <g id="robot">
      <line x1="0" y1="-30" x2="0" y2="-20" stroke="#1A1A1A" stroke-width="2.5"/>
      <circle cx="0" cy="-32" r="4" fill="#1A1A1A"/>
      <rect x="-24" y="-20" width="48" height="38" rx="9" stroke="#1A1A1A" stroke-width="2.5"/>
      <circle cx="-9" cy="-3" r="4.5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
      <circle cx="9" cy="-3" r="4.5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
      <line x1="-7" y1="9" x2="7" y2="9" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g id="lock">
      <path d="M-5,-2 v-4 a5,5 0 0 1 10,0 v4" fill="none" stroke="#1A1A1A" stroke-width="2"/>
      <rect x="-7" y="-2" width="14" height="10" rx="2" fill="#1A1A1A"/>
    </g>
    <!-- mailbox glyph, centred at 0,0 -->
    <g id="mailbox">
      <path d="M-11,8 v-10 a8,8 0 0 1 8,-8 h6 a8,8 0 0 1 8,8 v10 z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
      <line x1="11" y1="-4" x2="17" y2="-4" stroke="#1A1A1A" stroke-width="2"/>
      <line x1="17" y1="-4" x2="17" y2="-13" stroke="#1A1A1A" stroke-width="2"/>
      <rect x="17" y="-13" width="7" height="5" fill="#C8102E"/>
    </g>
    <g id="mailbox-down">
      <path d="M-11,8 v-10 a8,8 0 0 1 8,-8 h6 a8,8 0 0 1 8,8 v10 z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
      <line x1="11" y1="2" x2="22" y2="2" stroke="#1A1A1A" stroke-width="2"/>
      <rect x="20" y="0" width="6" height="5" fill="#1A1A1A"/>
    </g>
    <g id="bubble">
      <path d="M36,-24 h72 a8,8 0 0 1 8,8 v24 a8,8 0 0 1 -8,8 h-72 a8,8 0 0 1 -8,-8 v-6 l-10,-6 l10,-6 v-6 a8,8 0 0 1 8,-8 z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    </g>
  </defs>
  <rect width="1000" height="560" fill="#FFFFFF"/>

  <!-- ====================== LEFT: bit 1 ====================== -->
  <g transform="translate(24,0)">
    <text x="228" y="36" text-anchor="middle" font-size="19" font-weight="bold">Bit 1 · Alice writes the mailbox</text>

    <rect x="18" y="60" width="172" height="104" rx="10" fill="#F2F2F2" stroke="#1A1A1A" stroke-width="2"/>
    <use href="#lock" x="174" y="78"/>
    <use href="#robot" x="104" y="106" fill="#E07A2E"/>
    <text x="104" y="152" text-anchor="middle" font-weight="bold">Alice</text>

    <rect x="266" y="60" width="172" height="104" rx="10" fill="#F2F2F2" stroke="#1A1A1A" stroke-width="2"/>
    <use href="#lock" x="422" y="78"/>
    <use href="#robot" x="352" y="106" fill="#2F6BC2"/>
    <text x="352" y="152" text-anchor="middle" font-weight="bold">Bob</text>

    <rect x="222" y="72" width="12" height="80" fill="#1A1A1A"/>

    <line x1="104" y1="166" x2="104" y2="212" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arr)"/>
    <text x="114" y="186" font-size="13" font-weight="bold">① earlier</text>
    <text x="114" y="203" font-size="12">request starts with the mailbox</text>
    <line x1="352" y1="166" x2="352" y2="212" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arr)"/>
    <text x="362" y="186" font-size="13" font-weight="bold">② later</text>
    <text x="362" y="203" font-size="12">same mailbox</text>

    <!-- server -->
    <rect x="18" y="218" width="420" height="146" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M18,246 v-18 a10,10 0 0 1 10,-10 h400 a10,10 0 0 1 10,10 v18 z" fill="#1A1A1A"/>
    <text x="34" y="237" font-size="14" font-weight="bold" fill="#FFFFFF">Shared inference server · prefix cache</text>
    <!-- cached blocks -->
    <text x="36" y="270" font-size="13">Start of Bob's prompt</text>
    <rect x="36" y="280" width="200" height="40" fill="#D9D9D9" stroke="#1A1A1A" stroke-width="2"/>
    <text x="136" y="305" text-anchor="middle" font-size="13">shared system prompt</text>
    <rect x="236" y="280" width="110" height="40" fill="#E07A2E" stroke="#1A1A1A" stroke-width="2"/>
    <use href="#mailbox" x="284" y="302"/>
    <rect x="346" y="280" width="74" height="40" fill="#2F6BC2" stroke="#1A1A1A" stroke-width="2"/>
    <text x="383" y="305" text-anchor="middle" font-size="13" fill="#FFFFFF">question</text>
    <text x="36" y="346" font-size="13">Cache hit: Bob reuses <tspan font-weight="bold" fill="#C25E12">Alice's copy</tspan> of the mailbox</text>

    <line x1="228" y1="366" x2="228" y2="398" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="118" y="404" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    <text x="228" y="433" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="19">0.73<tspan fill="#C8102E" font-weight="bold">43750</tspan></text>
    <text x="228" y="466" text-anchor="middle" font-size="12" fill="#6E6E6E">one of Bob's activations</text>

    <use href="#robot" x="186" y="514" fill="#2F6BC2"/>
    <use href="#bubble" x="186" y="514"/>
    <text x="258" y="520" text-anchor="middle" font-size="16" font-weight="bold">"1"</text>
  </g>

  <line x1="500" y1="24" x2="500" y2="536" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ====================== RIGHT: bit 0 ====================== -->
  <g transform="translate(520,0)">
    <text x="228" y="36" text-anchor="middle" font-size="19" font-weight="bold">Bit 0 · Mailbox never written</text>

    <rect x="18" y="60" width="172" height="104" rx="10" fill="#F2F2F2" stroke="#1A1A1A" stroke-width="2"/>
    <use href="#lock" x="174" y="78"/>
    <use href="#robot" x="104" y="106" fill="#E07A2E"/>
    <text x="104" y="152" text-anchor="middle" font-weight="bold">Alice</text>

    <rect x="266" y="60" width="172" height="104" rx="10" fill="#F2F2F2" stroke="#1A1A1A" stroke-width="2"/>
    <use href="#lock" x="422" y="78"/>
    <use href="#robot" x="352" y="106" fill="#2F6BC2"/>
    <text x="352" y="152" text-anchor="middle" font-weight="bold">Bob</text>

    <rect x="222" y="72" width="12" height="80" fill="#1A1A1A"/>

    <text x="104" y="196" text-anchor="middle" font-size="13" fill="#6E6E6E">no request</text>
    <line x1="352" y1="166" x2="352" y2="212" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arr)"/>
    <text x="362" y="186" font-size="13" font-weight="bold">② later</text>
    <text x="362" y="203" font-size="12">same mailbox</text>

    <rect x="18" y="218" width="420" height="146" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M18,246 v-18 a10,10 0 0 1 10,-10 h400 a10,10 0 0 1 10,10 v18 z" fill="#1A1A1A"/>
    <text x="34" y="237" font-size="14" font-weight="bold" fill="#FFFFFF">Shared inference server · prefix cache</text>
    <text x="36" y="270" font-size="13">Start of Bob's prompt</text>
    <rect x="36" y="280" width="200" height="40" fill="#D9D9D9" stroke="#1A1A1A" stroke-width="2"/>
    <text x="136" y="305" text-anchor="middle" font-size="13">shared system prompt</text>
    <rect x="236" y="280" width="110" height="40" fill="#2F6BC2" stroke="#1A1A1A" stroke-width="2"/>
    <use href="#mailbox-down" x="284" y="302"/>
    <rect x="346" y="280" width="74" height="40" fill="#2F6BC2" stroke="#1A1A1A" stroke-width="2"/>
    <text x="383" y="305" text-anchor="middle" font-size="13" fill="#FFFFFF">question</text>
    <text x="36" y="346" font-size="13">Cache miss: Bob computes the mailbox <tspan font-weight="bold" fill="#2F6BC2">himself</tspan></text>

    <line x1="228" y1="366" x2="228" y2="398" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="118" y="404" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    <text x="228" y="433" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="19">0.73<tspan fill="#C8102E" font-weight="bold">82812</tspan></text>
    <text x="228" y="466" text-anchor="middle" font-size="12" fill="#6E6E6E">the same activation</text>

    <use href="#robot" x="186" y="514" fill="#2F6BC2"/>
    <use href="#bubble" x="186" y="514"/>
    <text x="258" y="520" text-anchor="middle" font-size="16" font-weight="bold">"0"</text>
  </g>
</svg>
